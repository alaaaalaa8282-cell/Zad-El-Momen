name: Build & Release APK - زاد المؤمن

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Create local.properties
        run: |
          cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}"
          SUPPORT_1="${{ secrets.SUPPORT_1 }}"
          SUPPORT_5="${{ secrets.SUPPORT_5 }}"
          SUPPORT_10="${{ secrets.SUPPORT_10 }}"
          SUPPORT_25="${{ secrets.SUPPORT_25 }}"
          SUPPORT_100="${{ secrets.SUPPORT_100 }}"
          EOF

      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -alias zadelmomen \
            -keyalg RSA -keysize 2048 \
            -validity 9125 \
            -keystore zadelmomen.jks \
            -storepass zadelmomen123 \
            -keypass zadelmomen123 \
            -dname "CN=ZadElMomen,O=Islamic,C=EG" \
            -noprompt

      - name: Build APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/zadelmomen.jks \
            -Pandroid.injected.signing.store.password=zadelmomen123 \
            -Pandroid.injected.signing.key.alias=zadelmomen \
            -Pandroid.injected.signing.key.password=zadelmomen123

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "زاد المؤمن - إصدار ${{ github.run_number }}"
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
